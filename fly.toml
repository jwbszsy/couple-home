# Fly.io —— 在项目目录执行 `fly launch` 后按提示完成（提供免费额度和持久卷）
app = "couple-home"
primary_region = "hkg"

[build]
  builder = "dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "couple_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
