<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理后台 · 我们的小屋</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:linear-gradient(165deg,#ffeaf1,#f6efff); color:#5b3a44; min-height:100vh; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin-bottom:12px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab { border:1.5px solid #ff8fab; background:#fff; color:#fb6f92; border-radius:999px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .tab.on { background:linear-gradient(135deg,#ff8fab,#fb6f92); color:#fff; border-color:transparent; }
  .card { background:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.9); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 10px 30px rgba(251,111,146,.12); }
  label { font-size:12.5px; font-weight:700; color:#a6808c; display:block; margin-bottom:6px; }
  input { border:1.5px solid rgba(255,179,198,.6); border-radius:12px; padding:10px 13px; font-size:14px; font-family:inherit; outline:none; }
  input:focus { border-color:#ff8fab; }
  button { border:0; border-radius:999px; padding:9px 16px; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; }
  .primary { background:linear-gradient(135deg,#ff8fab,#fb6f92); color:#fff; width:100%; }
  .ghost { background:#fff; color:#fb6f92; border:1.5px solid #ff8fab; }
  .danger { background:#fff; color:#e5484d; border:1.5px solid #e5484d; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
  .stat { background:linear-gradient(145deg,#fff,#ffe5ec); border-radius:14px; padding:12px 6px; text-align:center; }
  .stat b { font-size:18px; color:#fb6f92; display:block; }
  .stat span { font-size:11.5px; color:#a6808c; }
  .totals { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; font-size:12.5px; }
  .totals b { color:#fb6f92; font-size:15px; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:92px; margin-bottom:16px; }
  .bar { flex:1; background:linear-gradient(180deg,#ff8fab,#fb6f92); border-radius:4px 4px 0 0; min-height:2px; position:relative; }
  .bar span { position:absolute; bottom:-15px; left:50%; transform:translateX(-50%); font-size:9px; color:#a6808c; white-space:nowrap; }
  .sec { font-weight:800; font-size:13px; margin:4px 0 8px; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .row input { flex:1; }
  .codes { max-height:300px; overflow:auto; font-size:12.5px; }
  .codes div { display:flex; justify-content:space-between; padding:6px 8px; border-bottom:1px dashed rgba(255,179,198,.4); }
  .used { color:#a6808c; text-decoration:line-through; }
  .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:10px; font-size:12.5px; color:#a6808c; }
  .pair { border:1px solid rgba(255,179,198,.4); border-radius:14px; padding:12px; margin-bottom:10px; background:#fff; }
  .pair h3 { font-size:14px; margin-bottom:6px; }
  .pair .meta { font-size:12px; color:#a6808c; line-height:1.7; }
  .pair .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .pair .btns button { padding:7px 12px; font-size:12px; }
  .flag { background:linear-gradient(145deg,#fff,#ffe5ec); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; line-height:1.6; }
  .flag b { color:#e5484d; }
  .modal-mask { position:fixed; inset:0; z-index:50; background:rgba(91,40,60,.4); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal { background:#fff; border-radius:18px; width:100%; max-width:520px; max-height:86vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(91,40,60,.3); }
  .modal h3 { padding:14px 16px; font-size:15px; border-bottom:1px solid rgba(255,179,198,.4); }
  .modal .body { padding:12px 16px; overflow:auto; flex:1; }
  .mline { padding:7px 0; border-bottom:1px dashed rgba(255,179,198,.3); font-size:13px; line-height:1.6; }
  .mline .who { color:#fb6f92; font-weight:700; }
  .mline .time { color:#a6808c; font-size:11px; margin-left:6px; }
  .mline .flag { color:#e5484d; font-weight:700; }
  .hidden { display:none !important; }
  .muted { color:#a6808c; font-size:12px; }
  .refresh { display:flex; justify-content:flex-end; margin-bottom:10px; }
  .refresh button { padding:7px 14px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠 管理后台</h1>
  <div class="card" id="login-card">
    <label>管理密码</label>
    <input type="password" id="pass" placeholder="输入管理密码" />
    <button class="primary" id="login-btn">登录</button>
    <p class="muted" id="err"></p>
  </div>
  <div id="main-card" class="hidden">
    <div class="tabs">
      <button class="tab on" data-tab="overview">📊 概览</button>
      <button class="tab" data-tab="codes">🎟 激活码</button>
      <button class="tab" data-tab="pairs">🏠 小屋管理</button>
      <button class="tab" data-tab="flags">🚨 违规记录</button>
    </div>
    <div class="refresh"><button class="ghost" id="refresh-btn">🔄 刷新</button></div>

    <div id="tab-overview">
      <div class="card">
        <div class="stats">
          <div class="stat"><b id="s-total">-</b><span>总码数</span></div>
          <div class="stat"><b id="s-used">-</b><span>已使用</span></div>
          <div class="stat"><b id="s-left">-</b><span>剩余</span></div>
        </div>
        <div class="totals" id="totals"></div>
        <div class="sec">📊 每日活跃人数（近 14 天）</div>
        <div class="bars" id="dau-bars"></div>
        <div class="sec">🏠 每日新建小屋（近 14 天）</div>
        <div class="bars" id="pair-bars"></div>
      </div>
    </div>

    <div id="tab-codes" class="hidden">
      <div class="card">
        <div class="row">
          <button class="ghost" id="export-btn" style="flex:1;">📤 导出未用码</button>
        </div>
        <div class="row">
          <input type="number" id="gen-count" value="10" min="1" max="500" />
          <button class="ghost" id="gen-btn">＋ 补充 N 个码</button>
        </div>
        <p class="muted" id="new-codes"></p>
        <div class="row"><input id="code-search" placeholder="搜索激活码…" /></div>
        <div class="codes" id="code-list"></div>
        <div class="pager">
          <button class="ghost" id="code-prev">上一页</button><span id="code-page"></span><button class="ghost" id="code-next">下一页</button>
        </div>
      </div>
    </div>

    <div id="tab-pairs" class="hidden">
      <div class="card" id="pair-list"><p class="muted">加载中…</p></div>
    </div>

    <div id="tab-flags" class="hidden">
      <div class="card" id="flag-list"><p class="muted">加载中…</p></div>
    </div>
  </div>
</div>

<div class="modal-mask hidden" id="modal-mask">
  <div class="modal">
    <h3>💬 聊天记录监看</h3>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
let token = localStorage.getItem('admin_token') || '';
let allCodes = [];
let codePage = 0, codeSearch = '';
const PAGE = 50;

async function post(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
  const j = await r.json().catch(()=>null);
  if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || '请求失败');
  return j.data;
}
function fmt(ts) { if (!ts) return ''; const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function barsHtml(arr, key) {
  const last = arr.slice(-14);
  const max = Math.max(1, ...last.map((x) => x[key]));
  return last.map((x) => {
    const h = Math.max(2, Math.round((x[key] / max) * 88));
    const label = String(x.date).slice(5).replace('-', '/');
    return '<div class="bar" style="height:' + h + 'px;" title="' + x.date + ' · ' + x[key] + '"><span>' + label + '</span></div>';
  }).join('');
}
function switchTab(tab) {
  $$('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  ['overview','codes','pairs','flags'].forEach((t) => $('#tab-' + t).classList.toggle('hidden', t !== tab));
  if (tab === 'pairs') loadPairs();
  if (tab === 'flags') loadFlags();
}
function loadOverview() {
  return Promise.all([post('/api/admin/stats', { token }), post('/api/admin/stats/daily', { token })])
    .then(([s, dl]) => {
      allCodes = s.codes;
      $('#s-total').textContent = s.total; $('#s-used').textContent = s.used; $('#s-left').textContent = s.remaining;
      $('#totals').innerHTML = '小屋 <b>' + dl.totals.pairs + '</b> ｜ 用户 <b>' + dl.totals.members + '</b> ｜ 激活码 <b>' + dl.totals.usedCodes + '/' + dl.totals.codes + '</b>';
      $('#dau-bars').innerHTML = barsHtml(dl.days, 'dau');
      $('#pair-bars').innerHTML = barsHtml(dl.days, 'newPairs');
      renderCodes();
    });
}
function renderCodes() {
  const q = codeSearch.toUpperCase();
  const list = allCodes.filter((x) => !q || x.code.includes(q));
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  codePage = Math.min(codePage, pages - 1);
  const slice = list.slice(codePage * PAGE, codePage * PAGE + PAGE);
  $('#code-list').innerHTML = slice.map((x) =>
    '<div class="' + (x.used ? 'used' : '') + '"><span>' + x.code + '</span><span>' + (x.used ? ('已用 ' + fmt(x.usedAt)) : '未用') + '</span></div>'
  ).join('') || '<p class="muted">无匹配码</p>';
  $('#code-page').textContent = (codePage + 1) + ' / ' + pages;
  $('#code-prev').disabled = codePage === 0;
  $('#code-next').disabled = codePage >= pages - 1;
}
function loadPairs() {
  $('#pair-list').innerHTML = '<p class="muted">加载中…</p>';
  return post('/api/admin/pairs', { token }).then((d) => {
    $('#pair-list').innerHTML = d.pairs.map((p) =>
      '<div class="pair"><h3>🏠 ' + (p.creator || '?') + (p.disabled ? ' <span style="color:#e5484d;">（已停用）</span>' : '') + '</h3>' +
      '<div class="meta">创建：' + fmt(p.createdAt) + ' ｜ 成员：' + p.memberCount + ' ｜ 动态：' + p.entries + ' ｜ 消息：' + p.chatMsgs +
      (p.lastActive ? ' ｜ 最近活跃：' + fmt(p.lastActive) : '') +
      (p.usedCode ? ' ｜ 激活码：' + p.usedCode : '') + '</div>' +
      '<div class="btns">' +
      '<button class="ghost" data-chat="' + p.id + '">💬 聊天记录</button>' +
      (p.disabled
        ? '<button class="ghost" data-enable="' + p.id + '">✅ 启用</button>'
        : '<button class="danger" data-disable="' + p.id + '">⛔ 停用</button>') +
      '</div></div>'
    ).join('') || '<p class="muted">还没有小屋</p>';
    $$('#pair-list [data-chat]').forEach((b) => { b.onclick = () => openChat(p.id, b.dataset.chat); });
    $$('#pair-list [data-disable]').forEach((b) => { b.onclick = () => setPair(b.dataset.disable, true); });
    $$('#pair-list [data-enable]').forEach((b) => { b.onclick = () => setPair(b.dataset.enable, false); });
  });
}
function setPair(pairId, disabled) {
  if (!confirm(disabled ? '确定停用这个小屋？双方将无法使用，数据保留。' : '确定启用这个小屋？')) return;
  post('/api/admin/pair/set', { token, pairId, disabled }).then(() => loadPairs()).catch((e) => alert(e.message));
}
function openChat(selfPairId, pairId) {
  $('#modal-body').innerHTML = '<p class="muted">加载中…</p>';
  $('#modal-mask').classList.remove('hidden');
  post('/api/admin/chat/history', { token, pairId }).then((d) => {
    $('#modal-body').innerHTML = d.messages.map((m) =>
      '<div class="mline">' +
      (m.revoked ? '<span class="muted">（已撤回）</span>'
        : '<span class="who">' + m.from + '</span>' + '<span class="time">' + fmt(m.ts) + '</span> ' + m.preview) +
      (m.flagged ? ' <span class="flag">🚨 ' + (m.flaggedWords || []).join('/') + '</span>' : '') +
      '</div>'
    ).join('') || '<p class="muted">还没有聊天记录</p>';
  }).catch((e) => { $('#modal-body').innerHTML = '<p class="muted">' + e.message + '</p>'; });
}
function loadFlags() {
  $('#flag-list').innerHTML = '<p class="muted">加载中…</p>';
  return post('/api/admin/flagged', { token }).then((d) => {
    $('#flag-list').innerHTML = (d.flagged.length ? d.flagged.map((x) =>
      '<div class="flag">🚨 <b>' + (x.nickname || '未知用户') + '</b> 命中敏感词：<b>' + x.words.join('、') + '</b><br/>时间：' + fmt(x.ts) + ' ｜ 小屋：' + x.pairId + '</div>'
    ).join('') : '<p class="muted">暂无违规记录</p>');
  });
}
function loadAll() { return loadOverview(); }
function refresh() { loadAll().catch(() => {}); }

$('#login-btn').onclick = async () => {
  try {
    const d = await post('/api/admin/login', { password: $('#pass').value });
    token = d.token; localStorage.setItem('admin_token', token);
    $('#login-card').classList.add('hidden'); $('#main-card').classList.remove('hidden');
    $('#err').textContent = '';
    refresh();
  } catch (e) { $('#err').textContent = e.message; }
};
$('#refresh-btn').onclick = refresh;
$$('.tab').forEach((b) => { b.onclick = () => switchTab(b.dataset.tab); });
$('#export-btn').onclick = async () => {
  try {
    const d = await post('/api/admin/codes/export', { token });
    const blob = new Blob([d.text], { type:'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'couple-home-codes.txt';
    a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { alert(e.message); }
};
$('#gen-btn').onclick = async () => {
  try {
    const n = parseInt($('#gen-count').value, 10) || 10;
    const d = await post('/api/admin/codes/generate', { token, count: n });
    $('#new-codes').textContent = '已生成：' + d.codes.join('、');
    loadAll();
  } catch (e) { alert(e.message); }
};
$('#code-search').addEventListener('input', (e) => { codeSearch = e.target.value; codePage = 0; renderCodes(); });
$('#code-prev').onclick = () => { if (codePage > 0) { codePage--; renderCodes(); } };
$('#code-next').onclick = () => { codePage++; renderCodes(); };
$('#modal-mask').onclick = (e) => { if (e.target === $('#modal-mask')) $('#modal-mask').classList.add('hidden'); };

if (token) {
  $('#login-card').classList.add('hidden');
  $('#main-card').classList.remove('hidden');
  refresh().catch(() => {
    token = ''; localStorage.removeItem('admin_token');
    $('#login-card').classList.remove('hidden'); $('#main-card').classList.add('hidden');
    $('#err').textContent = '登录已失效，请重新登录';
  });
}
</script>
</body>
</html>
