name: build-apk
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'capacitor-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Capacitor deps
        working-directory: capacitor-app
        run: npm install
      - name: Build debug APK
        working-directory: capacitor-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: capacitor-app/android/build.log
      - name: Publish failure log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-fail-${{ github.run_number }}
          name: 构建失败日志 #${{ github.run_number }}
          body: 自动上传的构建失败日志（build.log）
          files: capacitor-app/android/build.log
          fail_on_unmatched_files: true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: couple-home-apk
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 我们的小屋 APK #${{ github.run_number }}
          body: |
            自动构建的安卓安装包（debug 签名，可直接安装）。
            安装方式：手机下载 APK → 允许“安装未知来源应用” → 打开安装。
          files: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true